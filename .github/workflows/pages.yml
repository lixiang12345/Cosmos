name: Deploy Cosmos website to GitHub Pages

on:
  push:
    branches:
      - main
    paths:
      - website/**
      - .github/workflows/pages.yml
  workflow_dispatch:

concurrency:
  group: github-pages
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  build:
    name: Validate and package website
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Check out repository
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6

      - name: Validate static website
        shell: bash
        run: |
          set -euo pipefail

          for file in \
            website/index.html \
            website/product.html \
            website/manual.html \
            website/en/index.html \
            website/en/product.html \
            website/en/manual.html \
            website/assets/site.css \
            website/assets/site.js \
            website/assets/favicon.svg; do
            test -s "$file"
          done

          if find website -type l -print -quit | grep -q .; then
            echo "GitHub Pages artifact must not contain symbolic links." >&2
            exit 1
          fi

          python3 -m http.server 4175 --directory website >/tmp/cosmos-pages-http.log 2>&1 &
          server_pid=$!
          trap 'kill "$server_pid" >/dev/null 2>&1 || true' EXIT

          ready=false
          for _ in {1..20}; do
            if curl --fail --silent --show-error http://127.0.0.1:4175/ >/dev/null; then
              ready=true
              break
            fi
            sleep 0.25
          done
          test "$ready" = true

          for path in \
            / \
            /product.html \
            /manual.html \
            /en/ \
            /en/product.html \
            /en/manual.html \
            /assets/site.css \
            /assets/site.js \
            /assets/favicon.svg; do
            curl --fail --silent --show-error "http://127.0.0.1:4175$path" >/dev/null
          done

      - name: Configure GitHub Pages
        uses: actions/configure-pages@983d7736d9b0ae728b81ab479565c72886d7745b # v5

      - name: Upload GitHub Pages artifact
        uses: actions/upload-pages-artifact@7b1f4a764d45c48632c6b24a0339c27f5614fb0b # v4
        with:
          path: website

  deploy:
    name: Deploy website
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    needs: build
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@d6db90164ac5ed86f2b6aed7e0febac5b3c0c03e # v4
